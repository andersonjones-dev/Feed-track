<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Feeds</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#7fa88f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><script src="config.js"></script>
<style>
:root{--bg:#faf6f0;--card:#fffdf9;--ink:#3b3a37;--mute:#8c867c;--line:#eee6da;--acc:#7fa88f;--accd:#5e8a6f;--soft:#e6f0e9;--warm:#f6d9c6;--warn:#c9774f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f1c;--card:#262925;--ink:#ecebe6;--mute:#9a9a91;--line:#33372f;--accd:#9cc4ab;--soft:#2c3a31;--warm:#4a3a30;--warn:#e29a74}}
:root[data-theme="dark"]{--bg:#1d1f1c;--card:#262925;--ink:#ecebe6;--mute:#9a9a91;--line:#33372f;--accd:#9cc4ab;--soft:#2c3a31;--warm:#4a3a30;--warn:#e29a74}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;line-height:1.4}
.wrap{max-width:460px;margin:0 auto;padding:14px 16px 150px}

h1{font-size:21px;margin:0}
.icon{background:none;border:0;font-size:20px;color:var(--mute);padding:8px;cursor:pointer}
.fl{display:inline-block;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px) rotate(4deg)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.status{text-align:center}.status.soon{background:var(--warm)}.status.over{background:var(--warm);border-color:var(--warn)}
.lbl{font-size:13px;color:var(--mute);margin-bottom:6px}.lbl small{opacity:.8}
.big{font-size:40px;font-weight:700;letter-spacing:-1px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width 1s}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 auto;min-width:60px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:13px 8px;font:inherit;font-size:15px;cursor:pointer;text-align:center}
.chip.on{background:var(--soft);border-color:var(--acc);color:var(--accd);font-weight:700}
.chip.sm{padding:8px;font-size:13px;border-radius:12px}
.sec{margin-top:16px}.hint{font-size:13px;color:var(--accd);margin-top:8px}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
.stepper input{width:90px;font:inherit;font-size:30px;font-weight:700;text-align:center;border:0;border-bottom:2px solid var(--line);background:none;color:var(--ink)}
.stepper span{color:var(--mute)}
.sw{display:flex;align-items:center;gap:10px}.sw b{font-size:30px;flex:1;font-variant-numeric:tabular-nums}.sw .chip{flex:0 0 auto}
.save{width:100%;margin-top:18px;border:0;border-radius:18px;background:var(--acc);color:#fff;font:inherit;font-size:17px;font-weight:700;padding:16px;cursor:pointer}
.save:disabled{opacity:.4}
input[type=time],.tx{font:inherit;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-top:8px}
.tx{flex:1 1 120px;margin:0}
.hist{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.hist:last-child{border:0}
.hist .t{width:72px;color:var(--mute);font-size:14px}.hist .d{flex:1;font-size:14px}
.hist button{background:none;border:0;color:var(--mute);font-size:21px;padding:6px 11px;cursor:pointer}
.sum{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.empty{color:var(--mute);text-align:center;padding:10px;font-size:14px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.big3 .chip{padding:22px 4px;font-size:15px}.big3 .chip span{display:block;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--soft);border-radius:16px;padding:10px;text-align:center}.tile b{display:block;font-size:22px}.tile small{font-size:11px;color:var(--mute)}
.bars{display:flex;gap:6px;align-items:flex-end;height:140px;overflow-x:auto}.bars div{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.bars i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px}.bars small{font-size:11px;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-size:10px;padding:4px 2px;cursor:pointer;border-radius:12px}
nav button span{display:block;font-size:22px}nav button.on{color:var(--accd);font-weight:700;background:var(--soft)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:436px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.sheet textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:428px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;font-size:14px;transform:translateY(300%);transition:transform .3s}
.toast.show{transform:none}.toast button{background:none;border:0;color:var(--bg);font:inherit;font-weight:700;text-decoration:underline}
.bu{position:fixed;bottom:130px;font-size:26px;pointer-events:none;animation:up 1.2s ease-out both}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-160px) scale(1.4)}}
.link{background:none;border:0;color:var(--accd);font:inherit;font-size:14px;text-decoration:underline;margin-top:10px;cursor:pointer}
.note{font-size:12px;color:var(--mute);text-align:center}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;background:var(--bg);margin:0 -16px 8px;padding:8px 16px}
header::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:80px;background:var(--bg)}
.hb{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.hb.av{background:var(--soft);color:var(--accd);font-weight:700;font-size:18px}
.ht{flex:1;min-width:0}.ht h1{line-height:1.2}.ht .lbl{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--card);z-index:41;transform:translateX(-102%);visibility:hidden;transition:transform .28s,visibility 0s .28s;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 24px;overflow-y:auto;box-shadow:6px 0 30px rgba(0,0,0,.18)}
.drawer.on{transform:none;visibility:visible;transition:transform .28s}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:0 6px}
.dav{width:48px;height:48px;border-radius:50%;background:var(--soft);color:var(--accd);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:0 0 48px}
.dg{font-size:11.5px;color:var(--mute);margin:18px 8px 4px;text-transform:uppercase;letter-spacing:.07em}
.dr{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:0;border-radius:14px;background:none;color:var(--ink);font:inherit;font-size:16px;text-align:left;cursor:pointer}.dr.on{background:var(--soft);font-weight:700;color:var(--accd)}
.di,.ti{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;font-size:20px;flex:0 0 auto;background:rgba(127,168,143,.2);background:color-mix(in srgb,var(--tc,#7fa88f) 20%,transparent)}
.bdg{background:var(--warn);color:#fff;border-radius:10px;font-size:12px;padding:1px 8px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}
.tl{background:none;border:0;color:var(--ink);font:inherit;font-size:12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0}.tl .ti{width:54px;height:54px;border-radius:16px;font-size:26px}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qa button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12px;border-radius:16px;padding:10px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.qa span{font-size:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid4 .tile{padding:10px 4px}.grid4 .tile b{font-size:19px}
.h2{font-size:16px;font-weight:700;margin:18px 2px 8px}
.up{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.up:last-child{border:0}.up .d{flex:1;font-size:14px}
.pg{animation:pgin .25s ease}@keyframes pgin{from{opacity:0;transform:translateY(6px)}}
.vgh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:0}
.vdot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:0 0 12px}.vdot.ok{background:var(--acc)}.vdot.due{background:var(--warn)}
.vform{padding:10px;background:var(--soft);border-radius:14px}
nav button{flex:1;font-size:11px;padding:6px 2px}nav button span{font-size:23px}
button,.chip{-webkit-user-select:none;user-select:none}
.hide{display:none}
.alert{display:block;width:100%;text-align:left;background:var(--warm);border-color:var(--warn);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.card.low{background:var(--warm);border-color:var(--warn)}
.hist button.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--acc);padding:0;margin-right:10px;flex:0 0 auto;font-size:16px;color:#fff}.hist button.chk.on{background:var(--acc)}
.fab.live{background:var(--warn);animation:pz 1.6s ease-in-out infinite}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .wd{text-align:center;font-size:11px;color:var(--mute)}
.day{aspect-ratio:1/1.1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:3px 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}
.day b{font-size:13px}.day small{font-size:10px;line-height:1.1;color:var(--mute)}.day.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--soft)}.day.today b{color:var(--accd);text-decoration:underline}
.gear{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:24px;cursor:pointer;color:var(--ink)}
.ringw{position:relative;width:220px;height:220px;margin:6px auto 2px}.ringw svg{width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(127,168,143,.25))}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px}
.ringc .big{font-size:36px;font-variant-numeric:tabular-nums;letter-spacing:0}
.status.soon .ringw{animation:pz 1.8s ease-in-out infinite}@keyframes pz{50%{transform:scale(1.035)}}
.cs{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.cs.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.cust{display:flex;align-items:center;justify-content:center;position:relative;background:var(--card);font-size:20px}.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.vm{position:fixed;inset:0;z-index:50;background:rgba(30,30,28,.55);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .5s}
.vc{background:var(--card);border-radius:28px;padding:28px 24px;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.vc p{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.55;margin:10px 0}
.vc b{color:var(--accd);font-size:14px}
@keyframes fade{from{opacity:0}}
</style></head>
<body><div class="wrap"><header id="hd"></header><div id="main"></div></div>
<button class="fab" id="fab" onclick="vOpen()" aria-label="Voice entry">🎤</button>
<div class="sheet hide" id="vs"><div class="lbl" id="vst"></div>
<textarea id="vt" rows="3" placeholder="Say or type: “Fed from right breast, topped up with 30 ml formula via paladai 20 minutes ago”"></textarea>
<div class="row"><button class="chip sm" onclick="vMic()">🎤 Speak</button><button class="chip sm on" onclick="vGo()">Log it</button><button class="chip sm" onclick="vClose()">Close</button><button class="chip sm" id="hfb" onclick="hfToggle()">🎧 Hands-free: off</button></div><div class="note" style="margin-top:6px">Try: “start timer left”, “stop”, “save”, “add diapers to shopping list”, “bought 2 tins of formula”. In hands-free mode, start entries with “log”, “add”, “bought” or “used”.</div></div>
<div class="toast" id="toast"><span id="tmsg"></span><button onclick="undo()">Undo</button></div>
<nav id="tabs"></nav>
<div class="scrim" id="scrim" onclick="drawer(0)"></div>
<aside class="drawer" id="drawer" aria-label="Menu" aria-hidden="true"></aside>
<script>
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D={baby:{name:'',dob:'',kg:''},fi:180,pi:180,lead:15,log:[],ss:null,nt:{},me:'',fam:'',cu:0,sy:{pushed:0,pulled:0}};
let st=D;
try{const r=localStorage.getItem('feedlog2');if(r)st=Object.assign({},D,JSON.parse(r));else{const o=JSON.parse(localStorage.getItem('feedlog')||'null');if(o&&o.feeds)st=Object.assign({},D,{fi:o.interval||180,lead:o.lead||15,log:o.feeds.map(f=>({id:f.id,t:f.t,cat:'feed',sides:f.type==='L'?['L']:f.type==='R'?['R']:f.type==='B'?['L','R']:[],bottle:f.type==='F'?{ml:f.ml||0,milk:'formula',via:'bottle'}:null}))})}}catch(e){}
const persist=()=>{try{localStorage.setItem('feedlog2',JSON.stringify(st))}catch(e){}};
const live=()=>st.log.filter(e=>!e.del);
function norm(e){if(e.cat==='feed'||e.cat==='pump')e.sides=Array.isArray(e.sides)?e.sides:Object.values(e.sides||{});return e}
st.log.forEach(e=>{if(!e.u)e.u=e.t||1;norm(e)});
let u={tab:'home',vg:{},r:'7',set:false,f:{s:[],b:false,fm:true,em:false,mlF:90,mlE:60,ml:90,milk:'formula',via:'bottle'},p:{s:[],ml:60},w:{off:0,c:false,time:''},sw:{run:false,start:0,acc:0}},lastId=null,tt,rec;
const TABS=[['home','🏠','Home'],['feed','🍼','Feed'],['pump','💧','Pump'],['diaper','🧷','Diaper'],['sleep','🌙','Sleep']];
const id=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dur=ms=>{const m=Math.round(Math.abs(ms)/6e4),h=Math.floor(m/60);return h?`${h}h ${m%60}m`:`${m}m`};
const mmss=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const sideL=s=>s.length>1?'Both breasts':s[0]==='L'?'Left':'Right';
const ch=(l,on,js,c='')=>`<button class="chip ${c} ${on?'on':''}" onclick="${js}">${l}</button>`;
function age(){const d=st.baby.dob;if(!d)return'';const days=Math.floor((Date.now()-new Date(d))/864e5);if(days<0)return'';const w=Math.floor(days/7);return w<12?w+(w===1?' wk':' wks'):Math.floor(days/30.44)+' mo'}
function head(){const b=st.baby,sy=st.fam&&DB&&(navigator.onLine?'☁️ synced':'📴 offline'),home=u.tab==='home',sub=home?[age(),b.kg&&b.kg+' kg',sy].filter(Boolean).join(' · ')||'Tap the round button to add age & weight':[b.name,age(),sy].filter(Boolean).join(' · ');
 $('hd').innerHTML=`<button class="hb" onclick="drawer(1)" aria-label="Open menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="ht"><h1>${home?(b.name?E(b.name):'Little Feeds')+' <span class="fl">🧸</span>':PAGE[u.tab]||''}</h1><div class="lbl">${E(sub)}</div></div><button class="hb av" onclick="goTab('settings')" aria-label="Baby profile and settings">${b.name?E(b.name[0].toUpperCase()):'🧸'}</button>`}
function desc(e){
 if(e.cat==='feed'){const p=[];if(e.sides.length)p.push('🤱 '+sideL(e.sides)+(e.secs?' · '+mmss(e.secs*1000):'')+(e.bml?' · ~'+e.bml+' mL':''));{const m=mlOf(e),q=[];if(m.f)q.push(m.f+' mL formula');if(m.x)q.push(m.x+' mL expressed milk');if(q.length||e.bottle)p.push('🍼 '+(q.join(' + ')||'bottle'))}return p.join('<br>')}
 if(e.cat==='pump')return '💧 '+(e.sides.length?sideL(e.sides):'Pumped')+(e.ml?' · '+e.ml+' mL':'')+(e.secs?' · '+mmss(e.secs*1000):'');
 if(e.cat==='diaper')return {wet:'💧 Wet',dirty:'💩 Dirty',both:'💧💩 Wet + dirty'}[e.kind];
 if(e.cat==='todo')return (e.done?'✅ ':'⬜ ')+E(e.text);
 if(e.cat==='med')return '💊 '+E(e.name)+(e.dose?' · '+E(e.dose):'');
 if(e.cat==='dose'){const m=st.log.find(x=>x.id===e.med)||{};return (e.st==='done'?'💊 Given: ':'⏭️ Skipped: ')+E(m.name||'medicine')+' · '+fSlot(e.slot)}
 if(e.cat==='item')return '📦 '+E(e.name);
 if(e.cat==='buy'){const i=itm(e.item)||{};return '🛍️ Bought '+e.packs+' '+(i.pn||'pack')+(e.packs>1?'s':'')+' · '+E(i.name||'item')+(e.price?' · '+e.price:'')}
 if(e.cat==='use'){const i=itm(e.item)||{};return '➖ Used '+e.qty+' '+(i.unit||'')+' · '+E(i.name||'item')}
 if(e.cat==='growth')return '📏 '+[e.kg&&e.kg+' kg',e.cm&&e.cm+' cm'].filter(Boolean).join(' · ');return '🌙 Slept '+dur(e.end-e.t)}

const cd=()=>`<div class="card status" id="cd"><div class="lbl" id="sl"></div><div class="ringw"><svg viewBox="0 0 200 200"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fa88f"/><stop offset="1" stop-color="#f0b48f"/></linearGradient></defs><circle cx="100" cy="100" r="88" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="rp" cx="100" cy="100" r="88" fill="none" stroke="url(#gr)" stroke-width="12" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="553" transform="rotate(-90 100 100)"/><g id="dot" transform="rotate(0 100 100)"><circle cx="100" cy="12" r="8" fill="var(--card)" stroke="var(--acc)" stroke-width="4"/></g></svg><div class="ringc"><div class="big" id="sb"></div><div class="lbl" id="sx" style="margin:4px 0 0"></div></div></div></div>`;

const MS=[

 {k:'4',m:4,l:'4 months',c:[['Social / emotional',['Smiles on their own to get your attention','Chuckles (not yet a full laugh) when you try to make them laugh','Looks at you, moves, or makes sounds to get or keep your attention']],['Language / communication',['Makes sounds like “oooo”, “aahh” (cooing)','Makes sounds back when you talk to them','Turns head towards the sound of your voice']],['Cognitive',['If hungry, opens mouth when they see breast or bottle','Looks at their hands with interest']],['Movement / physical',['Holds head steady without support when you are holding them','Holds a toy when you put it in their hand','Uses their arm to swing at toys','Brings hands to mouth','Pushes up onto elbows/forearms when on tummy']]]},
 {k:'6',m:6,l:'6 months',c:[['Social / emotional',['Knows familiar people','Likes to look at self in a mirror','Laughs']],['Language / communication',['Takes turns making sounds with you','Blows “raspberries” (sticks tongue out and blows)','Makes squealing noises']],['Cognitive',['Puts things in their mouth to explore them','Reaches to grab a toy they want','Closes lips to show they don’t want more food']],['Movement / physical',['Rolls from tummy to back','Pushes up with straight arms when on tummy','Leans on hands to support themselves when sitting']]]},
 {k:'9',m:9,l:'9 months',c:[['Social / emotional',['Is shy, clingy, or fearful around strangers','Shows several facial expressions, like happy, sad, angry, and surprised','Looks when you call their name','Reacts when you leave (looks, reaches for you, or cries)','Smiles or laughs when you play peek-a-boo']],['Language / communication',['Makes a lot of different sounds like “mamamama” and “bababababa”','Lifts arms up to be picked up']],['Cognitive',['Looks for objects when dropped out of sight (like a spoon or toy)','Bangs two things together']],['Movement / physical',['Gets to a sitting position by themselves','Moves things from one hand to the other','Uses fingers to “rake” food towards themselves','Sits without support']]]},
 {k:'12',m:12,l:'12 months',c:[['Social / emotional',['Plays games with you, like pat-a-cake']],['Language / communication',['Waves “bye-bye”','Calls a parent “mama” or “dada” or another special name','Understands “no” (pauses briefly or stops when you say it)']],['Cognitive',['Puts something in a container, like a block in a cup','Looks for things they see you hide, like a toy under a blanket']],['Movement / physical',['Pulls up to stand','Walks, holding on to furniture','Drinks from a cup without a lid, as you hold it','Picks things up between thumb and pointer finger, like small bits of food']]]},
 {k:'15',m:15,l:'15 months',c:[['Social / emotional',['Copies other children while playing, like taking toys out of a container when another child does','Shows you an object they like','Claps when excited','Hugs a stuffed doll or other toy','Shows you affection (hugs, cuddles, or kisses you)']],['Language / communication',['Tries to say one or two words besides “mama” or “dada,” like “ba” for ball or “da” for dog','Looks at a familiar object when you name it','Follows directions given with both a gesture and words','Points to ask for something or to get help']],['Cognitive',['Tries to use things the right way, like a phone, cup, or book','Stacks at least two small objects, like blocks']],['Movement / physical',['Takes a few steps on their own','Uses fingers to feed themselves some food']]]},
 {k:'18',m:18,l:'18 months',c:[['Social / emotional',['Moves away from you, but looks to make sure you are close by','Points to show you something interesting','Puts hands out for you to wash them','Looks at a few pages in a book with you','Helps you dress them by pushing arm through sleeve or lifting up foot']],['Language / communication',['Tries to say three or more words besides “mama” or “dada”','Follows one-step directions without any gestures, like giving you the toy when you say, “Give it to me.”']],['Cognitive',['Copies you doing chores, like sweeping with a broom','Plays with toys in a simple way, like pushing a toy car']],['Movement / physical',['Walks without holding on to anyone or anything','Scribbles','Drinks from a cup without a lid and may spill sometimes','Feeds themselves with their fingers','Tries to use a spoon','Climbs on and off a couch or chair without help']]]},
 {k:'24',m:24,l:'2 years',c:[['Social / emotional',['Notices when others are hurt or upset, like pausing or looking sad when someone is crying','Looks at your face to see how to react in a new situation']],['Language / communication',['Points to things in a book when you ask, like “Where is the bear?”','Says at least two words together, like “More milk.”','Points to at least two body parts when you ask them to show you','Uses more gestures than just waving and pointing, like blowing a kiss or nodding yes']],['Cognitive',['Holds something in one hand while using the other hand; for example, holding a container and taking the lid off','Tries to use switches, knobs, or buttons on a toy','Plays with more than one toy at the same time, like putting toy food on a toy plate']],['Movement / physical',['Kicks a ball','Runs','Walks (not climbs) up a few stairs with or without help','Eats with a spoon']]]}];

let rxDB=null,rxCache=null,rxUrls={},rxBusy=false,rxErr=false;
function rxOpen(){return new Promise((res,rej)=>{if(rxDB)return res(rxDB);try{const r=indexedDB.open('lf-rx',1);r.onupgradeneeded=()=>r.result.createObjectStore('rx',{keyPath:'id'});r.onsuccess=()=>{rxDB=r.result;res(rxDB)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
const rxTx=(mode,fn)=>rxOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction('rx',mode),q=fn(t.objectStore('rx'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
const rxAll=()=>rxTx('readonly',s=>s.getAll()),rxPut=o=>rxTx('readwrite',s=>s.put(o)),rxDelDb=i=>rxTx('readwrite',s=>s.delete(i));
function rxLoad(){if(rxBusy)return;rxBusy=true;rxAll().then(a=>{Object.values(rxUrls).forEach(x=>URL.revokeObjectURL(x));rxUrls={};a.sort((x,y)=>y.t-x.t);a.forEach(o=>{try{rxUrls[o.id]=URL.createObjectURL(o.blob)}catch(e){}});rxCache=a;rxBusy=false;if(u.tab==='rx')render()}).catch(()=>{rxCache=[];rxErr=true;rxBusy=false;if(u.tab==='rx')render()})}

 const w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight,sc=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),'image/jpeg',q))}

n him; for he careth for you."],["Psalm 23:1-2","The LORD is my shepherd; I shall not want. He maketh me to lie down in green pastures: he leadeth me beside the still waters."],["Zephaniah 3:17","The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing."],["Numbers 6:24-26","The LORD bless thee, and keep thee: The LORD make his face shine upon thee, and be gracious unto thee: The LORD lift up his countenance upon thee, and give thee peace."],["2 Corinthians 12:9","And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness."],["Psalm 28:7","The LORD is my strength and my shield; my heart trusted in him, and I am helped: therefore my heart greatly rejoiceth; and with my song will I praise him."],["Isaiah 66:13","As one whom his mother comforteth, so will I comfort you."],["Psalm 4:8","I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety."],["Matthew 19:14","But Jesus said, Suffer little children, and forbid them not, to come unto me: for of such is the kingdom of heaven."],["Galatians 6:9","And let us not be weary in well doing: for in due season we shall reap, if we faint not."],["1 Samuel 1:27","For this child I prayed; and the LORD hath given me my petition which I asked of him."],["Psalm 118:24","This is the day which the LORD hath made; we will rejoice and be glad in it."]];
let AC,lastBig=0;
const unlock=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}};
const SQ={tap:[[784,0,.16,.035]],tab:[[587,0,.18,.035],[880,.07,.2,.025]],save:[[523,0,.5,.06],[659,.1,.5,.06],[784,.2,.55,.06],[1047,.3,.9,.05]],del:[[392,0,.3,.05],[311,.1,.5,.045]],amen:[[659,0,.6,.05],[880,.15,.9,.05]]};
function sfx(k){if(st.snd===false||!AC)return;try{if(k!=='tap'&&k!=='tab')lastBig=performance.now();const n=AC.currentTime;(SQ[k]||[]).forEach(([f,t,d,v])=>[[1,1],[2.01,.22]].forEach(([m,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0,n+t);g.gain.linearRampToValueAtTime(v*a,n+t+.012);g.gain.exponentialRampToValueAtTime(.0001,n+t+d);o.start(n+t);o.stop(n+t+d+.05)}))}catch(e){}}

 const [r,t]=VERSES[i],d=document.createElement('div');d.className='vm';d.innerHTML=`<div class="vc"><div style="font-size:34px" class="fl">🕊️</div><p>“${t}”</p><b>${r} · KJV</b><button class="save" style="margin-top:20px">Amen 🙏</button></div>`;
 d.onclick=ev=>{if(ev.target.closest('.vc')&&!ev.target.closest('button'))return;sfx('amen');d.remove();medCheck()};document.body.appendChild(d)}
