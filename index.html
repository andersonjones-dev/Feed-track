<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Feeds</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#7fa88f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><script src="config.js"></script>
<style>
:root{--bg:#faf6f0;--card:#fffdf9;--ink:#3b3a37;--mute:#8c867c;--line:#eee6da;--acc:#7fa88f;--accd:#5e8a6f;--soft:#e6f0e9;--warm:#f6d9c6;--warn:#c9774f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f1c;--card:#262925;--ink:#ecebe6;--mute:#9a9a91;--line:#33372f;--accd:#9cc4ab;--soft:#2c3a31;--warm:#4a3a30;--warn:#e29a74}}
:root[data-theme="dark"]{--bg:#1d1f1c;--card:#262925;--ink:#ecebe6;--mute:#9a9a91;--line:#33372f;--accd:#9cc4ab;--soft:#2c3a31;--warm:#4a3a30;--warn:#e29a74}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;line-height:1.4}
.wrap{max-width:460px;margin:0 auto;padding:14px 16px 150px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:21px;margin:0}
.icon{background:none;border:0;font-size:20px;color:var(--mute);padding:8px;cursor:pointer}
.fl{display:inline-block;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px) rotate(4deg)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.status{text-align:center}.status.soon{background:var(--warm)}.status.over{background:var(--warm);border-color:var(--warn)}
.lbl{font-size:13px;color:var(--mute);margin-bottom:6px}.lbl small{opacity:.8}
.big{font-size:40px;font-weight:700;letter-spacing:-1px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width 1s}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 auto;min-width:60px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:13px 8px;font:inherit;font-size:15px;cursor:pointer;text-align:center}
.chip.on{background:var(--soft);border-color:var(--acc);color:var(--accd);font-weight:700}
.chip.sm{padding:8px;font-size:13px;border-radius:12px}
.sec{margin-top:16px}.hint{font-size:13px;color:var(--accd);margin-top:8px}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
.stepper input{width:90px;font:inherit;font-size:30px;font-weight:700;text-align:center;border:0;border-bottom:2px solid var(--line);background:none;color:var(--ink)}
.stepper span{color:var(--mute)}
.sw{display:flex;align-items:center;gap:10px}.sw b{font-size:30px;flex:1;font-variant-numeric:tabular-nums}.sw .chip{flex:0 0 auto}
.save{width:100%;margin-top:18px;border:0;border-radius:18px;background:var(--acc);color:#fff;font:inherit;font-size:17px;font-weight:700;padding:16px;cursor:pointer}
.save:disabled{opacity:.4}
input[type=time],.tx{font:inherit;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-top:8px}
.tx{flex:1 1 120px;margin:0}
.hist{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.hist:last-child{border:0}
.hist .t{width:72px;color:var(--mute);font-size:14px}.hist .d{flex:1;font-size:14px}
.hist button{background:none;border:0;color:var(--mute);font-size:17px;padding:4px 8px;cursor:pointer}
.sum{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.empty{color:var(--mute);text-align:center;padding:10px;font-size:14px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.big3 .chip{padding:22px 4px;font-size:15px}.big3 .chip span{display:block;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--soft);border-radius:16px;padding:10px;text-align:center}.tile b{display:block;font-size:22px}.tile small{font-size:11px;color:var(--mute)}
.bars{display:flex;gap:6px;align-items:flex-end;height:120px;overflow-x:auto}.bars div{flex:1;min-width:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.bars i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px}.bars small{font-size:11px;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:4px 8px;cursor:pointer;border-radius:12px}
nav button span{display:block;font-size:22px}nav button.on{color:var(--accd);font-weight:700;background:var(--soft)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:436px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.sheet textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:428px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;font-size:14px;transform:translateY(300%);transition:transform .3s}
.toast.show{transform:none}.toast button{background:none;border:0;color:var(--bg);font:inherit;font-weight:700;text-decoration:underline}
.bu{position:fixed;bottom:130px;font-size:26px;pointer-events:none;animation:up 1.2s ease-out both}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-160px) scale(1.4)}}
.link{background:none;border:0;color:var(--accd);font:inherit;font-size:14px;text-decoration:underline;margin-top:10px;cursor:pointer}
.note{font-size:12px;color:var(--mute);text-align:center}
.hide{display:none}
.gear{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:24px;cursor:pointer;color:var(--ink)}
.ringw{position:relative;width:220px;height:220px;margin:6px auto 2px}.ringw svg{width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(127,168,143,.25))}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px}
.ringc .big{font-size:36px;font-variant-numeric:tabular-nums;letter-spacing:0}
.status.soon .ringw{animation:pz 1.8s ease-in-out infinite}@keyframes pz{50%{transform:scale(1.035)}}
.cs{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.cs.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.cust{display:flex;align-items:center;justify-content:center;position:relative;background:var(--card);font-size:20px}.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.vm{position:fixed;inset:0;z-index:50;background:rgba(30,30,28,.55);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .5s}
.vc{background:var(--card);border-radius:28px;padding:28px 24px;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.vc p{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.55;margin:10px 0}
.vc b{color:var(--accd);font-size:14px}
@keyframes fade{from{opacity:0}}
</style></head>
<body><div class="wrap"><header id="hd"></header><div id="main"></div></div>
<button class="fab" onclick="vOpen()" aria-label="Voice entry">🎤</button>
<div class="sheet hide" id="vs"><div class="lbl" id="vst"></div>
<textarea id="vt" rows="3" placeholder="Say or type: “Fed from right breast, topped up with 30 ml formula via paladai 20 minutes ago”"></textarea>
<div class="row"><button class="chip sm" onclick="vMic()">🎤 Speak</button><button class="chip sm on" onclick="vGo()">Log it</button><button class="chip sm" onclick="vClose()">Close</button></div></div>
<div class="toast" id="toast"><span id="tmsg"></span><button onclick="undo()">Undo</button></div>
<nav id="tabs"></nav>
<script>
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D={baby:{name:'',dob:'',kg:''},fi:180,pi:180,lead:15,log:[],ss:null,nt:{},me:'',fam:'',cu:0,sy:{pushed:0,pulled:0}};
let st=D;
try{const r=localStorage.getItem('feedlog2');if(r)st=Object.assign({},D,JSON.parse(r));else{const o=JSON.parse(localStorage.getItem('feedlog')||'null');if(o&&o.feeds)st=Object.assign({},D,{fi:o.interval||180,lead:o.lead||15,log:o.feeds.map(f=>({id:f.id,t:f.t,cat:'feed',sides:f.type==='L'?['L']:f.type==='R'?['R']:f.type==='B'?['L','R']:[],bottle:f.type==='F'?{ml:f.ml||0,milk:'formula',via:'bottle'}:null}))})}}catch(e){}
const persist=()=>{try{localStorage.setItem('feedlog2',JSON.stringify(st))}catch(e){}};
const live=()=>st.log.filter(e=>!e.del);
function norm(e){if(e.cat==='feed'||e.cat==='pump')e.sides=Array.isArray(e.sides)?e.sides:Object.values(e.sides||{});return e}
st.log.forEach(e=>{if(!e.u)e.u=e.t||1;norm(e)});
let u={tab:'feed',r:'7',set:false,f:{s:[],b:false,ml:90,milk:'formula',via:'bottle'},p:{s:[],ml:60},w:{off:0,c:false,time:''},sw:{run:false,start:0,acc:0}},lastId=null,tt,rec;
const TABS=[['feed','🤱','Feed'],['pump','💧','Pump'],['diaper','🧷','Diaper'],['sleep','🌙','Sleep'],['ins','📊','Insights']];
const id=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dur=ms=>{const m=Math.round(Math.abs(ms)/6e4),h=Math.floor(m/60);return h?`${h}h ${m%60}m`:`${m}m`};
const mmss=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const sideL=s=>s.length>1?'Both breasts':s[0]==='L'?'Left':'Right';
const ch=(l,on,js,c='')=>`<button class="chip ${c} ${on?'on':''}" onclick="${js}">${l}</button>`;
function age(){const d=st.baby.dob;if(!d)return'';const days=Math.floor((Date.now()-new Date(d))/864e5);if(days<0)return'';const w=Math.floor(days/7);return w<12?w+(w===1?' wk':' wks'):Math.floor(days/30.44)+' mo'}
function head(){const b=st.baby,sub=[age(),b.kg&&b.kg+' kg',st.fam&&DB&&(navigator.onLine?'☁️ synced':'📴 offline')].filter(Boolean).join(' · ');$('hd').innerHTML=`<div><h1>${b.name?E(b.name):'Little one'} <span class="fl">🧸</span></h1><div class="lbl">${sub||'Tap ⚙️ to add age & weight'}</div></div><button class="gear" onclick="u.set=!u.set;render()" aria-label="Settings">⚙️</button>`}
function desc(e){
 if(e.cat==='feed'){const p=[];if(e.sides.length)p.push('🤱 '+sideL(e.sides)+(e.secs?' · '+mmss(e.secs*1000):'')+(e.bml?' · ~'+e.bml+' mL':''));if(e.bottle)p.push('🍼 '+(e.bottle.ml?e.bottle.ml+' mL ':'')+(e.bottle.milk==='ebm'?'expressed milk':'formula'));return p.join('<br>')}
 if(e.cat==='pump')return '💧 '+(e.sides.length?sideL(e.sides):'Pumped')+(e.ml?' · '+e.ml+' mL':'')+(e.secs?' · '+mmss(e.secs*1000):'');
 if(e.cat==='diaper')return {wet:'💧 Wet',dirty:'💩 Dirty',both:'💧💩 Wet + dirty'}[e.kind];
 return '🌙 Slept '+dur(e.end-e.t)}
function hist(c){const s=new Date();s.setHours(0,0,0,0);const l=live().filter(e=>e.cat===c&&e.t>=s.getTime());return `<div class="card"><div class="sum"><span>Today</span><span>${l.length}</span></div>${l.length?l.map(e=>`<div class="hist"><span class="t">${fmt(e.t)}</span><span class="d">${desc(e)}${e.by&&st.fam?`<br><small style="color:var(--mute)">by ${E(e.by)}</small>`:''}</span><button onclick="editE('${e.id}')" aria-label="Edit">✎</button><button onclick="askDel('${e.id}')" aria-label="Delete">✕</button></div>`).join(''):'<div class="empty">Nothing yet today 🌱</div>'}</div>`}
const cd=()=>`<div class="card status" id="cd"><div class="lbl" id="sl"></div><div class="ringw"><svg viewBox="0 0 200 200"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fa88f"/><stop offset="1" stop-color="#f0b48f"/></linearGradient></defs><circle cx="100" cy="100" r="88" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="rp" cx="100" cy="100" r="88" fill="none" stroke="url(#gr)" stroke-width="12" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="553" transform="rotate(-90 100 100)"/><g id="dot" transform="rotate(0 100 100)"><circle cx="100" cy="12" r="8" fill="var(--card)" stroke="var(--acc)" stroke-width="4"/></g></svg><div class="ringc"><div class="big" id="sb"></div><div class="lbl" id="sx" style="margin:4px 0 0"></div></div></div></div>`;
const endOf=e=>e.t+(e.secs||0)*1000;
const hms=ms=>{const x=Math.floor(Math.abs(ms)/1000),p=n=>String(n).padStart(2,'0');return Math.floor(x/3600)+':'+p(Math.floor(x%3600/60))+':'+p(x%60)};
const swNow=()=>u.sw.acc+(u.sw.run?Date.now()-u.sw.start:0);
function swTog(){if(u.sw.run){u.sw.acc+=Date.now()-u.sw.start;u.sw.run=false}else{u.sw.start=Date.now();u.sw.run=true}render()}
function swReset(){u.sw={run:false,start:0,acc:0};render()}
const takeSw=()=>{const s=Math.round(swNow()/1000);u.sw={run:false,start:0,acc:0};return s};
const swH=()=>`<div class="sw"><span class="fl">⏱</span><b id="sw">${mmss(swNow())}</b>${ch(u.sw.run?'Pause':u.sw.acc?'Resume':'Start',0,'swTog()','sm')}${u.sw.acc||u.sw.run?ch('Reset',0,'swReset()','sm'):''}</div>`;
const whenH=tm=>`<div class="sec"><div class="lbl">${tm&&(u.sw.acc||u.sw.run)?'When did it end?':'When?'}</div><div class="row">${[[0,'Just now'],[5,'5 min ago'],[10,'10 min ago'],[20,'20 min ago']].map(([v,l])=>ch(l,!u.w.c&&u.w.off===v,`setW(${v})`,'sm')).join('')}${ch('Other…',u.w.c,'setW(-1)','sm')}</div>${u.w.c?`<input type="time" value="${u.w.time}" oninput="u.w.time=this.value">`:''}</div>`;
function setW(v){if(v<0){u.w.c=true;if(!u.w.time)u.w.time=new Date().toTimeString().slice(0,5)}else{u.w.c=false;u.w.off=v}render()}
function getT(){if(u.w.c&&u.w.time){const [h,m]=u.w.time.split(':'),d=new Date(u.w.base||Date.now());d.setHours(+h,+m,0,0);if(!u.w.base&&d>new Date())d.setDate(d.getDate()-1);return d.getTime()}return Date.now()-u.w.off*6e4}
const resetW=()=>{u.w={off:0,c:false,time:''}};
const mlH=k=>`<div class="stepper"><button onclick="stp('${k}',-5)">−</button><input type="number" inputmode="numeric" step="5" min="0" value="${u[k].ml}" oninput="u['${k}'].ml=+this.value"><span>mL</span><button onclick="stp('${k}',5)">+</button></div><div class="row">${[30,60,90,120,150].map(n=>ch(n,u[k].ml===n,`u.${k}.ml=${n};render()`,'sm')).join('')}</div>`;
const stp=(k,d)=>{u[k].ml=Math.max(0,(+u[k].ml||0)+d);render()};
function tg(k,x){const a=u[k].s,i=a.indexOf(x);i<0?a.push(x):a.splice(i,1);render()}
function pFeed(){const f=u.f,lb=live().find(e=>e.cat==='feed'&&e.sides.length===1),ok=f.s.length||f.b;
 return cd()+`<div class="card">${u.edit?`<div class="hint" style="margin:0 0 10px">✎ Editing a saved feed <button class="link" style="margin:0 0 0 8px" onclick="cancelEdit()">Cancel</button></div>`:''}<div class="lbl">What was fed? <small>(pick all that apply)</small></div><div class="row">${ch('🤱 Left',f.s.includes('L'),"tg('f','L')")}${ch('🤱 Right',f.s.includes('R'),"tg('f','R')")}${ch('🍼 Bottle / cup',f.b,"u.f.b=!u.f.b;render()")}</div>${lb&&!f.s.length?`<div class="hint">Last breast was ${lb.sides[0]==='L'?'left':'right'} — start with ${lb.sides[0]==='L'?'right':'left'} this time</div>`:''}
 ${f.s.length?`<div class="sec"><div class="lbl">Breast feed timer</div>${swH()}</div>`:''}
 ${f.b?`<div class="sec"><div class="lbl">What was in it?</div><div class="row">${ch('Formula',f.milk==='formula',"u.f.milk='formula';render()",'sm')}${ch('Expressed milk',f.milk==='ebm',"u.f.milk='ebm';render()",'sm')}</div></div><div class="sec">${mlH('f')}</div>`:''}
 ${whenH(1)}<button class="save" ${ok?'':'disabled'} onclick="saveFeed()">${u.edit?'Update feed':'Save feed'}</button></div>`+hist('feed')}
function saveFeed(){const f=u.f,secs=f.s.length?takeSw():0,t=getT()-secs*1000;
 if(u.edit){const e=st.log.find(x=>x.id===u.edit&&x.cat==='feed');if(e){e.t=t;e.sides=[...f.s];if(secs)e.secs=secs;else delete e.secs;if(f.b)e.bottle={ml:+f.ml||0,milk:f.milk,via:f.via};else delete e.bottle;e.u=Date.now();finishEdit('feed');return}}
 const e={id:id(),t,cat:'feed',sides:[...f.s]};if(secs)e.secs=secs;if(f.b)e.bottle={ml:+f.ml||0,milk:f.milk,via:f.via};u.f.s=[];u.f.b=false;resetW();add(e)}
function goTab(k){if(u.edit&&u.tab!==k)clearEdit();u.tab=k;render()}
function clearEdit(){u.edit=null;u.sl=null;u.f.s=[];u.f.b=false;u.p.s=[];u.sw={run:false,start:0,acc:0};resetW()}
function cancelEdit(){clearEdit();render()}
function finishEdit(cat){st.log.sort((a,b)=>b.t-a.t);delete st.nt[cat];persist();syncSoon();clearEdit();sfx('save');toast(cat+' updated');render()}
function editE(i){const e=st.log.find(x=>x.id===i);if(!e)return;clearEdit();u.edit=i;u.set=false;u.tab=e.cat;const en=new Date(e.t+(e.secs||0)*1000),hm=d=>d.toTimeString().slice(0,5);
 u.w={off:0,c:true,time:hm(en),base:en.getTime()};u.sw={run:false,start:0,acc:(e.secs||0)*1000};
 if(e.cat==='feed'){const b=e.bottle;u.f={s:[...e.sides],b:!!b,ml:b?b.ml:u.f.ml,milk:b?b.milk:'formula',via:b?b.via:'bottle'}}
 else if(e.cat==='pump')u.p={s:[...e.sides],ml:e.ml||0};
 else if(e.cat==='sleep')u.sl={a:hm(new Date(e.t)),b:hm(new Date(e.end)),base:e.t};
 scrollTo(0,0);render()}
function sleepEd(){return `<div class="card"><div class="hint" style="margin:0 0 10px">✎ Editing a sleep entry <button class="link" style="margin:0 0 0 8px" onclick="cancelEdit()">Cancel</button></div><div class="lbl">Fell asleep at</div><input type="time" class="tx" style="width:100%" value="${u.sl.a}" oninput="u.sl.a=this.value"><div class="lbl" style="margin-top:12px">Woke up at</div><input type="time" class="tx" style="width:100%" value="${u.sl.b}" oninput="u.sl.b=this.value"><button class="save" onclick="saveSleep()">Update sleep</button></div>`}
function saveSleep(){const e=st.log.find(x=>x.id===u.edit&&x.cat==='sleep');if(!e||!u.sl.a||!u.sl.b)return;const [h1,m1]=u.sl.a.split(':'),[h2,m2]=u.sl.b.split(':'),s0=new Date(u.sl.base),e0=new Date(u.sl.base);s0.setHours(+h1,+m1,0,0);e0.setHours(+h2,+m2,0,0);if(e0<=s0)e0.setDate(e0.getDate()+1);e.t=s0.getTime();e.end=e0.getTime();e.u=Date.now();finishEdit('sleep')}

const VERSES=[["Psalm 127:3","Lo, children are an heritage of the LORD: and the fruit of the womb is his reward."],["Isaiah 40:11","He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young."],["Philippians 4:6-7","Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus."],["Isaiah 41:10","Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness."],["Matthew 11:28","Come unto me, all ye that labour and are heavy laden, and I will give you rest."],["Psalm 121:1-2","I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the LORD, which made heaven and earth."],["Lamentations 3:22-23","It is of the LORD’S mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness."],["Psalm 139:13-14","For thou hast possessed my reins: thou hast covered me in my mother’s womb. I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well."],["Joshua 1:9","Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest."],["Psalm 46:1","God is our refuge and strength, a very present help in trouble."],["Proverbs 22:6","Train up a child in the way he should go: and when he is old, he will not depart from it."],["Isaiah 40:31","But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."],["1 Peter 5:7","Casting all your care upon him; for he careth for you."],["Psalm 23:1-2","The LORD is my shepherd; I shall not want. He maketh me to lie down in green pastures: he leadeth me beside the still waters."],["Zephaniah 3:17","The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing."],["Numbers 6:24-26","The LORD bless thee, and keep thee: The LORD make his face shine upon thee, and be gracious unto thee: The LORD lift up his countenance upon thee, and give thee peace."],["2 Corinthians 12:9","And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness."],["Psalm 28:7","The LORD is my strength and my shield; my heart trusted in him, and I am helped: therefore my heart greatly rejoiceth; and with my song will I praise him."],["Isaiah 66:13","As one whom his mother comforteth, so will I comfort you."],["Psalm 4:8","I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety."],["Matthew 19:14","But Jesus said, Suffer little children, and forbid them not, to come unto me: for of such is the kingdom of heaven."],["Galatians 6:9","And let us not be weary in well doing: for in due season we shall reap, if we faint not."],["1 Samuel 1:27","For this child I prayed; and the LORD hath given me my petition which I asked of him."],["Psalm 118:24","This is the day which the LORD hath made; we will rejoice and be glad in it."]];
let AC,lastBig=0;
const unlock=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}};
const SQ={tap:[[784,0,.16,.035]],tab:[[587,0,.18,.035],[880,.07,.2,.025]],save:[[523,0,.5,.06],[659,.1,.5,.06],[784,.2,.55,.06],[1047,.3,.9,.05]],del:[[392,0,.3,.05],[311,.1,.5,.045]],amen:[[659,0,.6,.05],[880,.15,.9,.05]]};
function sfx(k){if(st.snd===false||!AC)return;try{if(k!=='tap'&&k!=='tab')lastBig=performance.now();const n=AC.currentTime;(SQ[k]||[]).forEach(([f,t,d,v])=>[[1,1],[2.01,.22]].forEach(([m,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0,n+t);g.gain.linearRampToValueAtTime(v*a,n+t+.012);g.gain.exponentialRampToValueAtTime(.0001,n+t+d);o.start(n+t);o.stop(n+t+d+.05)}))}catch(e){}}
const hl=document.createElement('label');hl.style.cssText='position:fixed;left:-99px;top:0;opacity:0;pointer-events:none';hl.innerHTML='<input type="checkbox" switch>';document.body.appendChild(hl);
function haptic(){if(st.hap===false)return;try{if(navigator.vibrate){navigator.vibrate(12);return}}catch(e){}try{hl.click()}catch(e){}}
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('button');if(!b)return;unlock();haptic();const k=b.closest('nav')?'tab':'tap';setTimeout(()=>{if(performance.now()-lastBig>250)sfx(k)},0)},true);
function showVerse(){if(st.vv===false)return;let i=Math.floor(Math.random()*VERSES.length);try{if(i===+localStorage.getItem('lfv'))i=(i+1)%VERSES.length;localStorage.setItem('lfv',i)}catch(e){}
 const [r,t]=VERSES[i],d=document.createElement('div');d.className='vm';d.innerHTML=`<div class="vc"><div style="font-size:34px" class="fl">🕊️</div><p>“${t}”</p><b>${r} · KJV</b><button class="save" style="margin-top:20px">Amen 🙏</button></div>`;
 d.onclick=ev=>{if(ev.target.closest('.vc')&&!ev.target.closest('button'))return;sfx('amen');d.remove()};document.body.appendChild(d)}
applyBg();render();setInterval(tick,1000);sync();showVerse();
